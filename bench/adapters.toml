# Tools under test, one entry per *configuration*. `module` picks the adapter
# class; the key is the row label. A tool may appear several times.
#
# The point of the benchmark is to compare each tool at its best, not to
# compare packaging defaults -- so where a tool has a stronger setup that
# costs something to build, it gets its own entry rather than being left off.

[tool.code-explorer]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
# Without this, a previous hybrid run's vector index would still be present
# and `search` would quietly fuse it -- see the observed-mode table.
reset = [".code-explorer/graph_vectors.sqlite"]
notes = [
  "Indexes Python only, so a relevant non-Python file is unreachable for it by construction.",
  "Full-text search (SQLite FTS5/BM25) with no vector component, because no vector index was built for this configuration.",
  "Returns whole symbols, and has a second expansion step, so its `bundle` row differs from its `seed` row.",
]

# `search` fuses a vector index into its FTS results whenever one exists, so
# the hybrid configuration is simply "the same tool, with that index built".
# One --semantic run at index time is what builds it (via local Ollama with
# nomic-embed-text).
[tool.code-explorer-hybrid]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
prepare = [["--semantic"]]
reset = [".code-explorer/graph_vectors.sqlite"]
notes = [
  "Indexes Python only, so a relevant non-Python file is unreachable for it by construction.",
  "Hybrid: FTS/BM25 fused with a vector index (Ollama nomic-embed-text) by reciprocal rank fusion.",
  "Returns whole symbols, and has a second expansion step, so its `bundle` row differs from its `seed` row.",
]

# Priority 1 from docs/explanation/gap-analysis-vs-zvec.md: index the body,
# not just the ~44-token skeleton. Entered as its own configuration rather
# than flipped in place, so the claim "this helps" is a measured delta
# against the rows above rather than a replacement nobody can check.
[tool.code-explorer-body]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
query_flags = ["--search-text", "body"]
reset = [".code-explorer/graph_vectors.sqlite"]
notes = [
  "Indexes Python only.",
  "FTS/BM25 over name + signature + docstring + callee names + the source body (capped at 2,000 chars). No vector component.",
  "Returns whole symbols, and has a second expansion step.",
]

[tool.code-explorer-body-hybrid]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
query_flags = ["--search-text", "body"]
prepare = [["--semantic"]]
reset = [".code-explorer/graph_vectors.sqlite"]
embedding = "ollama/nomic-embed-text"
notes = [
  "Indexes Python only.",
  "Hybrid: FTS/BM25 fused with a vector index, both built over the source body rather than the skeleton.",
  "Returns whole symbols, and has a second expansion step.",
]

# Matched pairs. Both tools support both model classes, so the embedding can
# be held constant and the comparison stops being partly a comparison of the
# models. potion-retrieval-32m is Model2Vec (static lookup, 512d);
# nomic-embed-text is a transformer (768d) -- zg carries an ONNX build of it.
[tool.code-explorer-body-potion]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
query_flags = ["--search-text", "body", "--embedding", "model2vec/minishlab/potion-retrieval-32m"]
prepare = [["--semantic"]]
reset = [".code-explorer/graph_vectors.sqlite"]
embedding = "model2vec/potion-retrieval-32m"
notes = [
  "Indexes Python only.",
  "Hybrid over the source body, with the same static Model2Vec model class zvec-grep defaults to -- the controlled comparison for zg.",
  "Returns whole symbols, and has a second expansion step.",
]

[tool.zg-nomic]
module = "zg"
command = ["zg"]
mode = "direct"
embedding = "local/nomic-embed-text-v1.5"
reset = [".zvec-grep"]
notes = [
  "Indexes every file type.",
  "Hybrid FTS+vector using the same transformer class code-explorer defaults to -- the controlled comparison for code-explorer-body-hybrid.",
  "Returns text chunks, not whole symbols.",
  "Has no expansion step, so its `bundle` row repeats its `seed` row.",
]

# Fusion depth. Offline, RRF keeps improving to a fetch depth of ~100 while
# BM25 alone saturates at ~40 -- the extra depth only pays when there is a
# second channel to fuse against. These rows test whether the pipeline
# actually realises that gain end to end.
[tool.code-explorer-body-potion-d10]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
query_flags = ["--search-text", "body", "--embedding", "model2vec/minishlab/potion-retrieval-32m", "--overfetch", "10"]
prepare = [["--semantic"]]
reset = [".code-explorer/graph_vectors.sqlite"]
embedding = "model2vec/potion-retrieval-32m"
notes = ["Hybrid over the source body with static embeddings, fusing 100-deep lists instead of 40."]

[tool.code-explorer-body-d10]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
query_flags = ["--search-text", "body", "--overfetch", "10"]
reset = [".code-explorer/graph_vectors.sqlite"]
notes = ["BM25 over the source body, fetching 100 deep. The control: depth without a second channel should barely move."]

# demote_tests suppresses 56% of this benchmark's ground-truth file slots,
# because a commit that changes behaviour changes its tests too. This row
# measures the cost -- with the caveat that winning it is partly an artifact
# of ground truth mined from commits, not proof the product should ship it.
[tool.code-explorer-body-notestdemo]
module = "code_explorer"
command = ["uv", "run", "--project", "{repo}", "--python", "3.12", "code-explorer"]
query_flags = ["--search-text", "body", "--test-demotion", "1.0"]
reset = [".code-explorer/graph_vectors.sqlite"]
notes = ["BM25 over the source body with test demotion disabled."]

[tool.zg]
module = "zg"
command = ["zg"]
# Without this, `zg index` on an existing index is a no-op and the
# recorded build time is "nothing to do", not "built in zero seconds".
reset = [".zvec-grep"]
mode = "direct"
embedding = "local/potion-retrieval-32m"
notes = [
  "Indexes every file type, so it can reach relevant files code-explorer never sees.",
  "Hybrid FTS+vector by default. Both tools have full-text search; the difference is whether a vector component is fused, which the observed-mode table above records per run.",
  "Returns text chunks, not whole symbols -- which is why scoring is at file level.",
  "Has no expansion step, so its `bundle` row repeats its `seed` row. That is its correct answer, not a missing measurement.",
]

[tool.zg-symbol]
module = "zg"
command = ["zg"]
# Without this, `zg index` on an existing index is a no-op and the
# recorded build time is "nothing to do", not "built in zero seconds".
reset = [".zvec-grep"]
mode = "direct"
embedding = "local/potion-retrieval-32m"
query_flags = ["--prefer-symbol"]
notes = [
  "Indexes every file type, so it can reach relevant files code-explorer never sees.",
  "Hybrid FTS+vector, biased toward exact indexed symbols (--prefer-symbol) -- the closest match to how code-explorer is meant to be queried.",
  "Returns text chunks, not whole symbols -- which is why scoring is at file level.",
  "Has no expansion step, so its `bundle` row repeats its `seed` row.",
]

# The token column only compares like with like if both tools deliver code.
# At --preview none zg returns paths plus one line per hit -- a table of
# contents, not the chapter -- so an agent must still open the files, which
# is the loop this benchmark exists to price. This entry returns the source.
# ripwire (github.com/redhat-et/ripwire): a Personalized-PageRank symbol
# ranker over a tree-sitter call graph, driven through its own recommended
# `--for=TASK` natural-language lens rather than its "debug" raw --query.
[tool.ripwire]
module = "ripwire"
command = ["ripwire"]
notes = [
  "Indexes every supported language (22+, tree-sitter based), so it can reach relevant non-Python files code-explorer never sees -- same asymmetry as zg.",
  "BM25 over a Personalized-PageRank-ranked symbol graph, name-exact or subtoken+body routed automatically per query; no vector component.",
  "Returns individual symbols (function/class granularity), scored at file level like code-explorer.",
  "--json never serves expanded bodies (bundle is always 'sigs' in that dialect), so it has no second expansion step -- its `bundle` row repeats its `seed` row, like zg.",
  "No explicit result-count flag for --for; it fills its own ~7.5KB signature budget and this adapter truncates client-side to k.",
  "No separate index-build step: each query cold-parses the corpus behind a warm-by-default per-root cache in the OS tmpdir, so the recorded wall_ms is steady-state per-query cost, not a build artifact.",
]

[tool.zg-full]
module = "zg"
command = ["zg"]
# Without this, `zg index` on an existing index is a no-op and the
# recorded build time is "nothing to do", not "built in zero seconds".
reset = [".zvec-grep"]
mode = "direct"
embedding = "local/potion-retrieval-32m"
preview = "full"
notes = [
  "Indexes every file type, so it can reach relevant files code-explorer never sees.",
  "Hybrid FTS+vector, returning full source previews -- the configuration whose token cost is comparable to an assembled context bundle.",
  "Returns text chunks, not whole symbols -- which is why scoring is at file level.",
  "Has no expansion step, so its `bundle` row repeats its `seed` row.",
]
