[project]
name = "code-retrieval-bench"
version = "0.1.0"
description = "Tool-neutral retrieval benchmark for code search CLIs"
requires-python = ">=3.10"
# Deliberately minimal, and deliberately *not* code-explorer. This package
# grades CLIs by shelling out to them; importing any tool under test would
# make the benchmark that tool's home field.
dependencies = [
    "ranx>=0.3.20",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
